name: Build Windows desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies and Electron runtime
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
      - name: Download and verify the free local model
        run: npm run setup:model
      - name: Test audio validation and local history
        run: npm test
      - name: Prepare public test speech
        run: node scripts/download-test-audio.mjs
      - name: Verify offline speech inference
        run: npm run test:engine -- .test-artifacts/jfk-16k.wav
      - name: Test microphone capture, desktop UI and persistence
        run: npm run test:desktop -- .test-artifacts/jfk-16k.wav
      - name: Bundle the single-file Windows executable
        run: npm run dist
      - name: Prepare executable checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath release -Filter '*.exe' -File | Select-Object -First 1
          if (!$exe) { throw 'No portable executable was produced.' }
          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          ($hash.Hash.ToLower() + '  ' + $exe.Name) | Set-Content -LiteralPath release/SHA256SUMS.txt
      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem -LiteralPath release -Filter '*.exe' -File | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe.FullName release/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $exe.FullName release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Whisperflow Local $version" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-screenshots
          path: .test-artifacts/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
